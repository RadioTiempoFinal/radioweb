<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIEMPO FINAL MEDIOS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="player-container" id="player">
        <!-- Fondo Dinámico con Blur -->
        <div class="player-bg" id="playerBg"></div>
        <div class="player-overlay"></div>

        <div class="player-card">
            <!-- Barra Superior: Logo, Selector e Historial -->
            <div class="top-bar">
                <div class="brand">
                    <i class="fa-solid fa-moon brand-icon"></i>
                    <span class="brand-name">TIEMPO FINAL<small></small></span>
                </div>
                <div class="top-controls">
                    <button id="historyToggleBtn" class="btn-icon" title="Historial de Canciones">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </button>
                </div>
            </div>

            <!-- Selector de Emisoras -->
            <div class="station-selector-wrapper">
                <i class="fa-solid fa-radio selector-icon"></i>
                <select id="stationSelect" class="station-select">
                    <!-- Cargado dinámicamente -->
                </select>
            </div>

            <!-- Panel Desplegable de Historial -->
            <div class="history-panel" id="historyPanel">
                <div class="history-header">
                    <h4><i class="fa-solid fa-list-ul"></i> Recientemente Sonadas</h4>
                    <button id="closeHistoryBtn" class="btn-close">&times;</button>
                </div>
                <ul class="history-list" id="historyList">
                    <!-- Cargado dinámicamente -->
                </ul>
            </div>

            <!-- Carátula / Arte de Disco -->
            <div class="cover-wrapper">
                <img src="https://imgur.com/YsjJ3V6" id="albumArt" alt="Carátula" class="album-art">
                <div class="live-badge"><i class="fa-solid fa-circle"></i> EN VIVO</div>
            </div>

            <!-- Información del Tema y Emisora -->
            <div class="track-info">
                <h2 id="songTitle" class="song-title">Cargando canción...</h2>
                <h3 id="artistName" class="artist-name">Cargando artista...</h3>
                <span id="stationTitle" class="station-tag">Nombre Emisora</span>
            </div>

            <!-- Visualizador de Audio HTML5 Canvas (Web Audio API) -->
            <div class="visualizer-container">
                <canvas id="audioVisualizer"></canvas>
            </div>

            <!-- Controles Principales -->
            <div class="controls">
                <button id="prevBtn" class="btn-secondary" title="Emisora Anterior">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button id="playBtn" class="btn-play" title="Reproducir / Pausar">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                </button>
                <button id="nextBtn" class="btn-secondary" title="Siguiente Emisora">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>

            <!-- Control de Volumen y Mute -->
            <div class="volume-container">
                <button id="muteBtn" class="btn-volume">
                    <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
                </button>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
            </div>
        </div>

        <!-- Elemento HTML5 de Audio -->
        <audio id="radioAudio" crossorigin="anonymous" preload="none"></audio>
    </div>

    <script src="js/config.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
